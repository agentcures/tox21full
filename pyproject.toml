[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tox21full"
version = "0.1.0"
description = "Generate the full Tox21 multi-task toxicity dataset from PubChem BioAssay records"
readme = "README.rst"
requires-python = ">=3.11,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "JJ Ben-Joseph", email = "jj@memoriesofzion.com"}]
keywords = [
  "tox21",
  "pubchem",
  "bioassay",
  "toxicity",
  "cheminformatics",
  "molecular-machine-learning",
  "dataset",
]
classifiers = [
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Operating System :: OS Independent",
]
dependencies = [
  "pandas>=2.2.2",
  "pyarrow>=18.0.0",
  "tqdm>=4.66.0",
]

[project.urls]
Homepage = "https://github.com/agentcures/tox21full"
Repository = "https://github.com/agentcures/tox21full"
Issues = "https://github.com/agentcures/tox21full/issues"

[project.scripts]
tox21full = "tox21full.__main__:main"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "twine>=6.1",
]

[tool.setuptools.packages.find]
include = ["tox21full*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
